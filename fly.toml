app = "wishlist-2026-app"
primary_region = "syd"

[build]

[env]
PORT = "3000"
HOST = "0.0.0.0"
NODE_ENV = "production"
DATABASE_URL = "file:/data/prod.sqlite"

[mounts]
source = "wishlist_data"
destination = "/data"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

  [http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/"
  timeout = "10s"

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
